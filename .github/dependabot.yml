version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Security updates only, no routine version-update PRs.
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
